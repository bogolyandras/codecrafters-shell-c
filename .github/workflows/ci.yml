name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        # Debug is -O0. RelWithDebInfo is -O2, where undefined behaviour that is harmless
        # unoptimised starts to matter, so both are run under the sanitizers.
        build_type: [Debug, RelWithDebInfo]
    env:
      # Report a leak, a use of a freed stack frame and a bad initialisation order, with a stack
      ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1:abort_on_error=0:print_stacktrace=1
      # Undefined behaviour stops the program (the default is to print and carry on, which
      # would let the test pass), and the stack says where
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_C_COMPILER=${{ matrix.compiler }}
          -DCMAKE_C_FLAGS="-Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build

      # Piped cases (tests/cases) and the line editor through a pseudo terminal (tests/legacy/pty_editor.py)
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120

  # Clang targeting the MSVC runtime (the Visual Studio environment supplies the headers and
  # libraries). Both rows are required: a failure fails the workflow.
  windows:
    name: Windows (clang, MSVC runtime, sanitizer ${{ matrix.sanitizer }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # "address" is separate so that a problem with the sanitizer runtime (an unverified
        # setup on this platform) cannot hide whether the plain build and tests work
        sanitizer: [none, address]
    steps:
      - uses: actions/checkout@v7

      # Puts the MSVC headers, libraries and linker in the environment, for clang and Ninja
      # vcvars64.bat sets INCLUDE, LIB and PATH for the Visual Studio headers, libraries and linker.
      # It only affects its own process, so what it sets is copied into the environment of the
      # following steps (GITHUB_ENV). vswhere ships with every Visual Studio, and so with the runner.
      - name: Visual Studio environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) { throw "Visual Studio with the C++ tools was not found" }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Add-Content -Path $env:GITHUB_ENV }
          }

      - name: Configure
        shell: bash
        run: |
          flags="-Wall -Wextra"
          runtime=""
          if [ "${{ matrix.sanitizer }}" = "address" ]; then
            # The AddressSanitizer runtime needs the release C runtime, not the debug one
            flags="$flags -fsanitize=address -fno-omit-frame-pointer"
            runtime="-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="$flags" \
            $runtime

      - name: Build
        run: cmake --build build

      # The cases in tests/cases/common: builtins and shell syntax, the same on every platform
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 120 -C Debug
